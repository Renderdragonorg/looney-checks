[project]
name = "music-copyright-checker"
version = "0.2.2"
description = "Spotify/file track lookup + AI-driven licensing research, as a UI-free backend package."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "spotapi>=0.1.0",
    "mutagen>=1.47",
    "pymongo>=4.0",
    "redis>=5.0",
    "websockets>=12.0",
    "certifi>=2023.5.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
music-copyright-checker = "music_copyright_checker.cli:main"
music-copyright-checker-server = "music_copyright_checker.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["music_copyright_checker*", "opencode_harness*"]
