name: build-binaries

# Builds a self-contained binary for every major platform, runs the test
# suite and a smoke test, then publishes the binaries as GitHub Release
# assets when a version tag (vX.Y.Z) is pushed.
#
# Runners use Blacksmith (https://docs.blacksmith.sh) for faster builds.
# Blacksmith is available to GitHub *organization* repositories where the
# Blacksmith app is installed; on a personal repository, swap each
# `blacksmith-*` label for its GitHub-hosted equivalent:
#   blacksmith-4vcpu-ubuntu-2404      -> ubuntu-24.04
#   blacksmith-4vcpu-ubuntu-2404-arm  -> ubuntu-24.04-arm
#   blacksmith-4vcpu-windows-2025     -> windows-2025
#   blacksmith-6vcpu-macos-latest     -> macos-14 (or macos-15)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: blacksmith-4vcpu-ubuntu-2404
            artifact: music-copyright-checker
            ext: ""
          - target: linux-aarch64
            runs-on: blacksmith-4vcpu-ubuntu-2404-arm
            artifact: music-copyright-checker
            ext: ""
          - target: windows-x86_64
            runs-on: blacksmith-4vcpu-windows-2025
            artifact: music-copyright-checker.exe
            ext: ".exe"
          - target: macos-aarch64
            runs-on: blacksmith-6vcpu-macos-latest
            artifact: music-copyright-checker
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Read project version
        id: version
        shell: bash
        run: |
          echo "version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build binary with PyInstaller
        run: python -m PyInstaller --noconfirm --distpath dist packaging/music_copyright_checker.spec

      - name: Smoke test the binary
        shell: bash
        run: python packaging/smoke_test.py "dist/${{ matrix.artifact }}"

      - name: Rename binary with version and target
        id: rename
        shell: bash
        run: |
          name="music-copyright-checker-${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}"
          mv "dist/${{ matrix.artifact }}" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.name }}
          path: dist/${{ steps.rename.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false