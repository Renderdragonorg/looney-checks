name: build-binaries

# Builds a self-contained onedir distribution for every major platform, runs
# the test suite and a smoke test, packages each as a .tar.gz/.zip archive, and
# publishes those archives as GitHub Release assets when a version tag
# (vX.Y.Z) is pushed. onedir (not onefile) keeps warm startup fast: onefile
# re-extracts the whole bundle on every launch.
#
# Runners use Blacksmith (https://docs.blacksmith.sh) for faster builds.
# Blacksmith is available to GitHub *organization* repositories where the
# Blacksmith app is installed; on a personal repository, swap each
# `blacksmith-*` label for its GitHub-hosted equivalent:
#   blacksmith-4vcpu-ubuntu-2404      -> ubuntu-24.04
#   blacksmith-4vcpu-ubuntu-2404-arm  -> ubuntu-24.04-arm
#   blacksmith-4vcpu-windows-2025     -> windows-2025
#   blacksmith-6vcpu-macos-latest     -> macos-26 (ARM64)
# macOS Intel is not offered on Blacksmith (Apple Silicon only), so the
# macos-x86_64 build always runs on a GitHub-hosted Intel runner
# (macos-26-intel).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: blacksmith-4vcpu-ubuntu-2404
            exec_ext: ""
            archive_ext: ".tar.gz"
          - target: linux-aarch64
            runs-on: blacksmith-4vcpu-ubuntu-2404-arm
            exec_ext: ""
            archive_ext: ".tar.gz"
          - target: windows-x86_64
            runs-on: blacksmith-4vcpu-windows-2025
            exec_ext: ".exe"
            archive_ext: ".zip"
          - target: macos-aarch64
            runs-on: blacksmith-6vcpu-macos-latest
            exec_ext: ""
            archive_ext: ".tar.gz"
          - target: macos-x86_64
            runs-on: macos-26-intel
            exec_ext: ""
            archive_ext: ".tar.gz"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Read project version
        id: version
        shell: bash
        run: |
          echo "version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build onedir distribution with PyInstaller
        run: python -m PyInstaller --noconfirm --distpath dist packaging/music_copyright_checker.spec

      - name: Smoke test the binary
        shell: bash
        run: python packaging/smoke_test.py "dist/music-copyright-checker/music-copyright-checker${{ matrix.exec_ext }}"

      - name: Package versioned archive
        id: package
        shell: bash
        run: |
          name="music-copyright-checker-${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.archive_ext }}"
          if [ "${{ matrix.archive_ext }}" = ".zip" ]; then
            python -c "import shutil; shutil.make_archive('dist/${name%.zip}', 'zip', 'dist', 'music-copyright-checker')"
          else
            tar -C dist -czf "dist/$name" music-copyright-checker
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all built archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Per-release notes live in docs/changes-<tag>.md (e.g. docs/changes-v0.3.4.md).
          body_path: docs/changes-${{ github.ref_name }}.md
          generate_release_notes: true
          fail_on_unmatched_files: false